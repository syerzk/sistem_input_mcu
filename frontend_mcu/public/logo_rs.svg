<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="600" height="120">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f3b5f" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>

  <!-- Top horizontal line -->
  <line x1="20" y1="18" x2="580" y2="18" stroke="#0f3b5f" stroke-width="3" stroke-linecap="round" />

  <!-- Bottom horizontal line -->
  <line x1="20" y1="102" x2="580" y2="102" stroke="#0f3b5f" stroke-width="3" stroke-linecap="round" />

  <!-- Emblem on left -->
  <g transform="translate(65, 60)">
    <!-- Tilted Ellipse Outer Ring -->
    <ellipse cx="0" cy="0" rx="34" ry="22" transform="rotate(-30)" fill="none" stroke="url(#ringGrad)" stroke-width="5" stroke-linecap="round" />
    
    <!-- Inner Accent Arc for depth -->
    <path d="M -15 15 C 5 28, 28 10, 26 -6" fill="none" stroke="#0f3b5f" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Yellow Caduceus / Medical Pulse Staff -->
    <path d="M -16 -24 L -13 0 L -17 4 L -11 25" fill="none" stroke="url(#yellowGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Small yellow arrow / pulse winglet -->
    <polygon points="-16,-10 -22,-6 -16,-2" fill="#eab308" />
  </g>

  <!-- Text on Right -->
  <!-- Line 1: PT GRAHA PUSRI MEDIKA -->
  <text x="135" y="48" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="14" font-weight="600" letter-spacing="3" fill="#1e5162">
    PT GRAHA PUSRI MEDIKA
  </text>

  <!-- Line 2: RUMAH SAKIT PUSRI -->
  <text x="135" y="80" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="28" font-weight="900" letter-spacing="1" fill="#0c2b48">
    RUMAH SAKIT PUSRI
  </text>
</svg>
